name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must match the app version)
        required: true
        default: v0.2.1
        type: string

permissions:
  contents: write

concurrency:
  group: ayre-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate release request
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if tag != 'v0.2.1' or not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('The current app version requires tag v0.2.1')
          PY
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to replace it.' >&2
            exit 1
          fi
          xcodebuild -version
          swift --version

      - name: Test core, lifecycle, and plugin helper
        run: |
          swift test -c release
          bash scripts/verify-lifecycle.sh
          bash plugins/ayre/tests/test-helper.sh

      - name: Import distribution signing identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          EXPECTED_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$EXPECTED_TEAM"
          keychain="$RUNNER_TEMP/ayre-signing.keychain-db"
          certificate="$RUNNER_TEMP/ayre-signing.p12"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          umask 077
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain"
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$keychain" > "$RUNNER_TEMP/ayre-identities.txt"
          python3 - <<'PY'
          import os, pathlib, re
          identities = pathlib.Path(os.environ['RUNNER_TEMP'], 'ayre-identities.txt').read_text()
          matches = re.findall(r'"(Developer ID Application: [^"]+)"', identities)
          matches = [name for name in matches if name.endswith('(' + os.environ['EXPECTED_TEAM'] + ')')]
          if len(matches) != 1:
              raise SystemExit('Expected exactly one valid Developer ID Application identity for APPLE_TEAM_ID')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('AYRE_SIGNING_IDENTITY=' + matches[0] + '\n')
          PY

      - name: Configure notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APPLE_ID"
          test -n "$APPLE_TEAM_ID"
          test -n "$APPLE_APP_SPECIFIC_PASSWORD"
          xcrun notarytool store-credentials ayre-ci \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Build, sign, notarize, and verify universal package
        run: bash scripts/release.sh "$AYRE_SIGNING_IDENTITY" ayre-ci

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          archive=build/release/Ayre-0.2.1-macOS.zip
          (cd build/release && shasum -a 256 Ayre-0.2.1-macOS.zip > SHA256SUMS)
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Ayre 0.2.1 for macOS 14 and later (Apple Silicon and Intel).

          Download the ZIP, extract Ayre.app, move it to a persistent location, and open it to grant Accessibility permission. Install the Claude Code plugin using the commands shown in Settings. Use Ayre Go or Ayre Pick in Spotlight to insert saved prompts without sending.

          This package is Developer ID signed and notarized. Review the artifact and perform a downloaded-app smoke test before publishing this draft.
          NOTES
          gh release create "$RELEASE_TAG" "$archive" build/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Ayre ${RELEASE_TAG#v}" --notes-file "$RUNNER_TEMP/release-notes.md" --draft

      - name: Remove signing material
        if: always()
        run: |
          keychain="$RUNNER_TEMP/ayre-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
          rm -f "$RUNNER_TEMP/ayre-signing.p12" "$RUNNER_TEMP/ayre-identities.txt"
